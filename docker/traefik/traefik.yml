api:
  dashboard: true
  insecure: false
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: { to: websecure, scheme: https, permanent: true }
  websecure:
    address: ":443"
providers:
  docker: { exposedByDefault: false, network: laravel }
  file: { directory: /etc/traefik/dynamic, watch: true }
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge: { entryPoint: web }
log: { level: INFO }
accessLog: {}
